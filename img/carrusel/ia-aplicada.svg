<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- Ilustración original: IA aplicada (red neuronal) -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#2C5F84"/>
      <stop offset="1" stop-color="#16324F"/>
    </radialGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#F7F5EF" opacity="0.12"/>
    </pattern>
    <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C8932A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C8932A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="300" fill="url(#fondo)"/>
  <rect width="800" height="300" fill="url(#puntos)"/>
  <circle cx="400" cy="150" r="110" fill="url(#brillo)"/>

  <!-- Conexiones: entrada -> oculta -->
  <g stroke="#F7F5EF" stroke-width="2" opacity="0.35">
    <line x1="250" y1="100" x2="400" y2="82"/>
    <line x1="250" y1="100" x2="400" y2="127"/>
    <line x1="250" y1="100" x2="400" y2="173"/>
    <line x1="250" y1="100" x2="400" y2="218"/>
    <line x1="250" y1="150" x2="400" y2="82"/>
    <line x1="250" y1="150" x2="400" y2="127"/>
    <line x1="250" y1="150" x2="400" y2="173"/>
    <line x1="250" y1="150" x2="400" y2="218"/>
    <line x1="250" y1="200" x2="400" y2="82"/>
    <line x1="250" y1="200" x2="400" y2="127"/>
    <line x1="250" y1="200" x2="400" y2="173"/>
    <line x1="250" y1="200" x2="400" y2="218"/>
  </g>
  <!-- Conexiones: oculta -> salida -->
  <g stroke="#F7F5EF" stroke-width="2" opacity="0.35">
    <line x1="400" y1="82" x2="550" y2="122"/>
    <line x1="400" y1="127" x2="550" y2="122"/>
    <line x1="400" y1="173" x2="550" y2="122"/>
    <line x1="400" y1="218" x2="550" y2="122"/>
    <line x1="400" y1="82" x2="550" y2="178"/>
    <line x1="400" y1="127" x2="550" y2="178"/>
    <line x1="400" y1="173" x2="550" y2="178"/>
    <line x1="400" y1="218" x2="550" y2="178"/>
  </g>
  <!-- Camino activo resaltado -->
  <polyline points="250,150 400,127 550,122" fill="none" stroke="#C8932A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="250,100 400,127" fill="none" stroke="#C8932A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Capa de entrada -->
  <g fill="#F7F5EF" stroke="#16324F" stroke-width="3">
    <circle cx="250" cy="100" r="13"/>
    <circle cx="250" cy="150" r="13"/>
    <circle cx="250" cy="200" r="13"/>
  </g>
  <!-- Capa oculta -->
  <g fill="#2C5F84" stroke="#F7F5EF" stroke-width="3">
    <circle cx="400" cy="82" r="13"/>
    <circle cx="400" cy="173" r="13"/>
    <circle cx="400" cy="218" r="13"/>
  </g>
  <circle cx="400" cy="127" r="16" fill="#C8932A" stroke="#F7F5EF" stroke-width="3"/>
  <!-- Capa de salida -->
  <circle cx="550" cy="122" r="16" fill="#C8932A" stroke="#F7F5EF" stroke-width="3"/>
  <circle cx="550" cy="178" r="13" fill="#F7F5EF" stroke="#16324F" stroke-width="3"/>

  <!-- Destellos -->
  <g stroke="#C8932A" stroke-width="3" stroke-linecap="round">
    <path d="M600 92v14M593 99h14"/>
    <path d="M196 212v10M191 217h10" opacity="0.7"/>
  </g>
  <circle cx="190" cy="92" r="6" fill="none" stroke="#C8932A" stroke-width="3"/>
  <circle cx="616" cy="208" r="8" fill="none" stroke="#F7F5EF" stroke-width="3" opacity="0.5"/>
</svg>
