<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULP Tech | Inscripción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header class="encabezado">
        <a class="marca" href="index.html">
            <span class="marca-icono" aria-hidden="true">🎓</span>
            <span class="marca-texto">
                <strong>ULP Tech</strong>
                <small>Universidad de La Punta</small>
            </span>
        </a>

        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contenido.html">Cursos y charlas</a></li>
                <li><a class="activa" href="contacto.html" aria-current="page">Inscripción</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- inicio formulario -->
        <form id="form-contacto" action="" method="post">
            <div>
                <label for="frm-nombre">Nombre:</label>
                <input name="nombre" id="frm-nombre" type="text">
            </div>
            <div>
                <label for="frm-apellido">Apellido:</label>
                <input name="apellido" id="frm-apellido" type="text">
            </div>
            <div>
                <label for="frm-correo">Correo:</label>
                <input name="correo" id="frm-correo" type="email">
            </div>
            <div>
                <label for="frm-tel">Teléfono:</label>
                <input name="telefono" id="frm-tel" type="tel">
            </div>
            <div>
                <label for="frm-mensaje">Deja tu mensaje</label>
                <textarea name="mensaje" id="frm-mensaje"></textarea>
            </div>
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
        <!--contenedor para la respuesta del DOM -->
        <div id="mensaje-respuesta"></div>
    </main>
    <footer class="pie">
        <p>© 2026 ULP Tech · Trabajo Final Integrador · Programación Web 1</p>
        <p><a href="https://www.ulp.edu.ar" target="_blank" rel="noopener">Sitio oficial de la Universidad de La
                Punta</a></p>
    </footer>
    <script src="js/contacto.js"></script>
</body>

</html>
