<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULP Tech | Inscripción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>

<body>
    <header class="encabezado">
        <a class="marca" href="index.html">
            <img class="marca-icono" src="img/favicon.svg" alt="">
            <span class="marca-texto">
                <strong>ULP Tech</strong>
                <small>Universidad de La Punta</small>
            </span>
        </a>

        <button class="menu-boton" id="menu-boton" type="button" aria-label="Abrir menú" aria-expanded="false"
            aria-controls="menu-principal">
            ☰
        </button>

        <nav class="menu" id="menu-principal" aria-label="Menú principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contenido.html">Cursos y charlas</a></li>
                <li><a href="contacto.html" aria-current="page">Inscripción</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenido-pagina">

        <div class="contenedor-formulario">
            <h1>Inscribite a un curso o charla</h1>

            <!-- novalidate: desactiva los avisos del navegador porque la validación la hace contacto.js -->
            <form id="form-contacto" novalidate>

                <div class="campo">
                    <label for="nombre">Nombre y apellido</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50" autocomplete="name" required>
                    <small class="mensaje-error" id="error-nombre"></small>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" maxlength="100" autocomplete="email"
                        placeholder="ej: nombre@mail.com" required>
                    <small class="mensaje-error" id="error-correo"></small>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="20" autocomplete="tel"
                        placeholder="Ej: 2664123456" required>
                    <small class="mensaje-error" id="error-telefono"></small>
                </div>

                <div class="campo">
                    <label for="curso">Curso o charla de interés</label>
                    <select id="curso" name="curso" required>
                        <option value="">Elegí una opción</option>
                        <option value="web">Curso: Desarrollo Web - Full Stack</option>
                        <option value="datos">Curso: Análisis de datos con Python</option>
                        <option value="ia">Charla: IA aplicada</option>
                        <option value="testing">Charla: Testing de software</option>
                    </select>
                    <small class="mensaje-error" id="error-curso"></small>
                </div>

                <div class="campo">
                    <label for="mensaje">Consulta</label>
                    <textarea id="mensaje" name="mensaje" rows="4" maxlength="300" required></textarea>
                    <small class="mensaje-error" id="error-mensaje"></small>
                </div>

                <button class="boton" type="submit">Enviar inscripción</button>
            </form>

            <!-- Acá contacto.js agrega el resumen de los datos enviados -->
            <div id="mensaje-respuesta" aria-live="polite"></div>
        </div>
    </main>
    <footer class="pie">
        <p>© 2026 ULP Tech · Trabajo Final Integrador · Programación Web 1</p>
        <p><a href="https://www.ulp.edu.ar" target="_blank" rel="noopener">Sitio oficial de la Universidad de La
                Punta</a></p>
    </footer>
    <script src="js/contacto.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
