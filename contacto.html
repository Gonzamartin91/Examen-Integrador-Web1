<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="contenido.html">Contenido</a>
            <a class="activa" href="contacto.html">Contacto</a>
        </nav>
    </header>
<main>
    <!-- inicio formulario -->
<form id="form-contacto" action="" method="post">
    <div>
        <label for="frm-nombre">Nombre:</label>
        <input name="nombre" id="frm-nombre" type="text">
    </div>
    <div>
        <label for="frm-apellido">Apellido:</label>
        <input name="apellido" id="frm-apellido" type="text">
    </div>
    <div>
        <label for="frm-correo">Correo:</label>
        <input name="correo" id="frm-correo" type="email">
    </div>
    <div>
        <label for="frm-tel">Teléfono:</label>
        <input name="telefono" id="frm-tel" type="tel">
    </div>
    <div>
        <label for="frm-mensaje">Deja tu mensaje</label>
        <textarea name="mensaje" name="mensaje" id="frm-mensaje"></textarea>
    </div>
    <div>
        <button type="submit">Enviar</button>
    </div>
</form>
<!--contenedor para la respuesta del DOM -->
<div id="mensaje-respuesta"></div>


</main>

<footer>
    <p>Footer - Datos del grupo © 2026 Sitio web</p>
</footer>




    <script src="js/contacto.js"></script>
</body>

</html>
